<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оценщик книг для Авито</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#4f46e5" />
    <script>
      // Immediately apply the theme from localStorage to prevent FOUC (Flash of Unstyled Content)
      try {
        const settingsItem = localStorage.getItem('bookValuerSettings');
        if (settingsItem) {
            const settings = JSON.parse(settingsItem);
            if (settings.theme === 'dark' || (settings.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
      } catch (e) {
        // Ignore errors, default to browser preference
      }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
