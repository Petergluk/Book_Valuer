<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оценщик книг для Авито</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <script>
      // Immediately apply the theme from localStorage to prevent FOUC (Flash of Unstyled Content)
      try {
        const settingsItem = localStorage.getItem('bookValuerSettings');
        if (settingsItem) {
            const settings = JSON.parse(settingsItem);
            if (settings.theme === 'dark' || (settings.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
      } catch (e) {
        // Ignore errors, default to browser preference
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // This configures Tailwind CSS. It MUST come after the main tailwind script.
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            keyframes: {
              'fade-in': {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
            },
            animation: {
              'fade-in': 'fade-in 0.2s ease-out',
            }
          }
        }
      }
    </script>
<script type="importmap">
{

  }
}
</script>
</head>

</html>
