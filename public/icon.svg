<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Book Spine -->
  <rect x="140" y="120" width="40" height="272" rx="8" fill="#312e81" />
  
  <!-- Book Pages / Body -->
  <path d="M160 128 C160 110, 180 110, 200 110 L352 110 A32 32 0 0 1 384 142 L384 384 A32 32 0 0 1 352 416 L200 416 C180 416, 160 396, 160 376 Z" fill="#f8fafc" />
  
  <!-- Book Cover Inner -->
  <path d="M160 144 C160 126, 180 126, 200 126 L352 126 A32 32 0 0 1 384 158 L384 384 L352 384 L200 384 C180 384, 160 364, 160 344 Z" fill="#ffffff" />
  
  <!-- Text lines (simulated) -->
  <rect x="210" y="170" width="130" height="16" rx="8" fill="#cbd5e1" />
  <rect x="210" y="210" width="130" height="16" rx="8" fill="#cbd5e1" />
  <rect x="210" y="250" width="90" height="16" rx="8" fill="#cbd5e1" />
  
  <!-- Price Badge -->
  <circle cx="340" cy="340" r="64" fill="#fbbf24" filter="url(#shadow)" />
  <circle cx="340" cy="340" r="54" fill="#f59e0b" />
  <text x="340" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle">₽</text>
</svg>
